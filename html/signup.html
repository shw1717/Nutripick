<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>회원가입</title>
    <link rel="stylesheet" href="../CSS/style.css" />
    <script defer src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script defer src="../JavaScript/data.js"></script>
    <script defer src="../JavaScript/auth.js"></script>
    <script defer src="../JavaScript/common.js"></script>
  </head>
  <body>
    <div id="header"></div>
    <main>
      <h1 class="auth-title">회원가입</h1>
      <div class="form-box auth-form-box">
        <label for="signupUsername">아이디</label>
        <input type="text" id="signupUsername" placeholder="영문, 숫자 포함 (7~20자)" />
        <label for="signupPassword">비밀번호</label>
        <input type="password" id="signupPassword" placeholder="6자 이상 입력하세요" />
        <label for="signupPasswordConfirm">비밀번호 확인</label>
        <input type="password" id="signupPasswordConfirm" placeholder="비밀번호를 다시 입력하세요" />
        <p id="signupError" class="auth-error"></p>
        <button class="btn auth-submit-btn" onclick="handleSignup()">회원가입</button>
        <p class="auth-switch">
          이미 계정이 있으신가요? <a href="login.html" class="auth-switch-link">로그인</a>
        </p>
      </div>
    </main>
    <div id="footer"></div>
    <script defer src="../JavaScript/signup.js"></script>
  </body>
</html>
